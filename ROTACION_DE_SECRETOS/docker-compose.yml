services:
  rotator_api:
    build:
      context: ./encryption-service-sample/
      dockerfile: Dockerfile
    container_name: rotator_api_container
    environment:
      - API_KEY=${API_KEY}
      - KEY_DIR=${KEY_DIR}
      - DATABASE_PATH=${DATABASE_PATH}
      - PRIVATE_KEY_LOCATION=${PRIVATE_KEY_LOCATION}
      - PUBLIC_KEY_LOCATION=${PUBLIC_KEY_LOCATION}
    ports:
      - "8000:8000"
    volumes:
      - crypto_keys:/app/keys

  rotator_nginx_frontend:
    build:
      context: ./nginx-frontend/
      dockerfile: Dockerfile
    container_name: rotator_nginx_frontend_container
    environment:
      - API_KEY=${API_KEY}
      - API_UPSTREAM=${API_UPSTREAM:-http://host.docker.internal:8000}
    ports:
      - "8090:8090"

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    hostname: ldap.example.com
    environment:
      LDAP_ORGANISATION: "Example Corp"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data_integrated:/var/lib/ldap
      - ldap_config_integrated:/etc/ldap/slapd.d
    networks:
      - ldap-network_integrated

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    hostname: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      # The image enables HTTPS by default. For this lab we intentionally
      # disable it so Apache serves phpLDAPadmin correctly on port 80.
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8080:80"
    depends_on:
      - openldap
    networks:
      - ldap-network

  api:
    build:
      context: ./LDAP/fastapi/
      dockerfile: Dockerfile
    container_name: ldap-api
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY}
      LDAP_HOST: openldap
      LDAP_PORT: "389"
      LDAP_BASE_DN: "dc=example,dc=com"
    depends_on:
      - openldap
    networks:
      - ldap-network

volumes:
  crypto_keys:
  ldap_data_integrated:
  ldap_config_integrated:

networks:
  ldap-network_integrated:
